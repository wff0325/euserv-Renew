name: EUserv 续期

on:
  schedule:
    # 初始运行时间
    - cron: '0 2 2 5 *'
  workflow_dispatch: 

permissions:
  contents: write
  actions: write

jobs:
  renew:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: 📥 下载私库脚本
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository_owner }}/Renew-Private
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}
        path: private

    - name: 📂 移动脚本到工作目录
      run: mv private/euser_renew.py euser_renew.py  

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # ❗ 修复：安装 Pillow (PIL) 以及脚本可能需要的其他基础库
        pip install requests beautifulsoup4 Pillow

    - name: Run EUserv renew script
      env:
        EUSERV_EMAIL: ${{ secrets.EUSERV_EMAIL }}
        EUSERV_PASSWORD: ${{ secrets.EUSERV_PASSWORD }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        SKIP_CONTRACTS: ${{ secrets.SKIP_CONTRACTS }}
        DEBUG: ${{ secrets.DEBUG }}
      run: python euser_renew.py 2>&1 | tee renew.log

    - name: 🔄 提取日期并更新 Cron & KeepAlive
      if: always()
      run: |
        echo "--- 日志末尾内容 ---"
        if [ -f renew.log ]; then tail -n 25 renew.log; else echo "log file missing"; fi
        echo "------------------"

        # 配置 Git 用户
        git config --local user.name "github-actions[bot]"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

        # 1. 提取可续期日期 (匹配格式: 2026-05-02)
        RAW_DATE=$(grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' renew.log | tail -1 | xargs || echo "")
        
        if [ -n "$RAW_DATE" ]; then
          echo "✅ 发现下次可续期日期: $RAW_DATE"
          
          # 2. 生成新 Cron (定在目标日期北京时间 10:00)
          NEW_CRON=$(date -d "$RAW_DATE 02:00" -u +"%M %H %d %m *" | tr -d '\n\r')
          echo "🚀 新生成的 UTC Cron: $NEW_CRON"
          
          # 3. 自动修改当前 YML 文件
          FILENAME=$(grep -l "cron:" .github/workflows/*.yml | head -n 1)
          if [ -n "$FILENAME" ]; then
            sed -i "s@cron: '.*'@cron: '$NEW_CRON'@g" "$FILENAME"
            git add "$FILENAME"
          fi
        else
          echo "⚠️ 未提取到日期，可能脚本运行失败或无需更新。"
        fi

        # 4. 更新 time.txt (防止 60 天任务被禁用)
        CURRENT_TIME=$(date +'%Y-%m-%d %H:%M:%S')
        echo "最后运行时间：$CURRENT_TIME" > time.txt
        git add time.txt

        # 5. 提交并强制推送
        if git diff --staged --quiet; then
          echo "没有内容变化，跳过推送。"
        else
          git commit -m "🔄 EUserv 更新预约与 KeepAlive: ${RAW_DATE:-$CURRENT_TIME}"
          git push "https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main --force
        fi
