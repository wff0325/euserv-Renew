name: EUserv Auto Renew

on:
  workflow_dispatch: # 手动触发
  schedule:
    - cron: '0 0 1,15 * *' # 每月1号和15号运行

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ 检出当前仓库
        uses: actions/checkout@v4
      
      - name: 📥 检出私有仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Renew-Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }} # 需要你在 Secrets 中配置名为 PRIVATE_REPO_TOKEN 的 PAT
          path: private
        
      - name: 📂 复制脚本
        run: |
          cp private/main.py main.py

      - name: 🐍 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安装依赖项
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 ddddocr

      - name: 🚀 运行续期脚本
        run: python main.py
