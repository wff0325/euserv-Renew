name: EUserv Auto Renew

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    
    steps:
      - name: ⬇️ 检出当前仓库
        uses: actions/checkout@v4
      
      - name: 📥 检出私有仓库
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Renew-Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }} 
          path: private
        
      - name: 📂 复制脚本
        run: |
          cp private/main.py main.py

      - name: 🐍 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🛠️ 安装系统依赖
        run: |
          sudo apt-get update
          # 解决 ddddocr 在 Ubuntu 24.04 上的依赖问题
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: 📦 安装 Python 依赖
        run: |
          pip install --upgrade pip
          pip install requests pillow ddddocr beautifulsoup4 imap-tools

      - name: 🚀 执行续期脚本
        run: python main.py
        env:
          DEBUG: "false"
