name: EUserv 续期

on:
  schedule:
    # 初始运行时间，运行成功后会自动被脚本修改
  - cron: '00 02 02 07 *'
  workflow_dispatch: 

permissions:
  contents: write
  actions: write

jobs:
  renew:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false # 必须关闭，后面用高级 Token 推送

    - name: 📥 下载私库脚本
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository_owner }}/Renew-Private
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}
        path: private

    - name: 📂 移动脚本到工作目录
      run: mv private/euser_renew.py euser_renew.py  

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 📦 Install dependencies (使用你的 requirements.txt)
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          echo "❌ 错误：未在仓库根目录找到 requirements.txt"
          exit 1
        fi

    - name: 🚀 Run EUserv renew script
      env:
        EUSERV_EMAIL: ${{ secrets.EUSERV_EMAIL }}
        EUSERV_PASSWORD: ${{ secrets.EUSERV_PASSWORD }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        SKIP_CONTRACTS: ${{ secrets.SKIP_CONTRACTS }}
        DEBUG: ${{ secrets.DEBUG }}
      run: python euser_renew.py 2>&1 | tee renew.log

    - name: 🔄 提取日期并更新 Cron & KeepAlive
      if: always()
      run: |
        # 1. 配置 Git 用户
        git config --local user.name "github-actions[bot]"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

        # 2. 提取日期 (格式: 2026-05-02)
        RAW_DATE=$(grep "可续期日期" renew.log | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | tail -1 | xargs || echo "")
        
        if [ -n "$RAW_DATE" ]; then
          echo "✅ 发现真正的下次可续期日期: $RAW_DATE"
          
          # 生成新 Cron (UTC 02:00)
          NEW_CRON=$(date -d "$RAW_DATE 02:00" -u +"%M %H %d %m *" | tr -d '\n\r')
          echo "🚀 目标新 Cron: $NEW_CRON"
          
          FILENAME=$(grep -l "cron:" .github/workflows/*.yml | head -n 1)
          if [ -n "$FILENAME" ]; then
            echo "📝 正在尝试修改文件: $FILENAME"
            
            # --- 核心改进：更强大的匹配模式 ---
            # 直接匹配 cron: 后面所有的内容，不管它是单引号、双引号还是没引号
            # 0,/cron:/ 确保只改第一个（顶部的 schedule）
            sed -i "0,/cron:/s@cron:.*@cron: '$NEW_CRON'@" "$FILENAME"
            
            # 打印修改后的那一行，方便从日志确认是否成功
            echo "🔍 修改后的 cron 行预览："
            grep "cron:" "$FILENAME" | head -n 1
            
            git add "$FILENAME"
          fi
        else
          echo "⚠️ 未在日志中找到“可续期日期”字样，跳过 Cron 更新。"
        fi

        # 3. 更新 time.txt (防止 60 天任务被禁用)
        echo "最后运行时间：$(date)" > time.txt
        git add time.txt

        # 4. 提交推送
        if git diff --staged --quiet; then
          echo "没有内容变化（可能日期与上次一致），跳过推送。"
        else
          git commit -m "🔄 自动更新: 下次预约 $RAW_DATE"
          git push "https://x-access-token:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main --force
        fi
