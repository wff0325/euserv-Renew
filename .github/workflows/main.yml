name: EUserv 续期

on:
  schedule:
    # 每月2号和3号运行
    - cron: '0 0 2,3 * *'
  workflow_dispatch:  # 允许手动触发工作流

jobs:
  renew:
    runs-on: ubuntu-latest
    
    # 必须添加这个权限，否则最后的 git push 会报 403 错误
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 📥 下载私库脚本
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Renew-Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: 📂 移动脚本到工作目录
        run: mv private/euser_renew.py euser_renew.py  

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run EUserv renew script
        env:
          EUSERV_EMAIL: ${{ secrets.EUSERV_EMAIL }}
          EUSERV_PASSWORD: ${{ secrets.EUSERV_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          SKIP_CONTRACTS: ${{ secrets.SKIP_CONTRACTS }}
          DEBUG: ${{ secrets.DEBUG }}
        run: python euser_renew.py

# =========================================================
      # ⏱️ 提交 time.txt 到仓库 (增加了 pull rebase 解决冲突)
      # =========================================================
      - name: Commit time.txt to repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. 配置用户信息
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 2. 更新时间文件
          CURRENT_TIME=$(date +'%Y-%m-%d %H:%M:%S')
          echo "最后续期运行时间：$CURRENT_TIME" > time.txt

          # 3. 提交记录
          git add time.txt
          
          if git diff --cached --quiet; then
            echo "没有内容变化，跳过提交。"
          else
            git commit -m "⏱️ KeepAlive: $CURRENT_TIME"
            
            # 4. 关键步骤：先拉取远程更新，防止冲突
            # --rebase 可以让你的提交直接排在远程提交之后，保持提交线整洁
            git pull --rebase origin ${{ github.ref_name }}
            
            # 5. 推送
            git push origin HEAD:${{ github.ref_name }}
          fi
